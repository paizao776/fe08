<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Missão G1</title>
    <style>
        .grade {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .caixa {
            background-color: royalblue;
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="grade">
        <div class="caixa">1</div>
        <div class="caixa">2</div>
        <div class="caixa">3</div>
        <div class="caixa">4</div>
    </div>

</body>
</html>
