<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Missão G3</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .pagina {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 12px;
            min-height: 100vh;
        }

        header {
            background-color: blue;
            color: white;
            padding: 30px;
        }

        main {
            background-color: lightgray;
            padding: 30px;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="pagina">
        <header>
            <h1>Cabeçalho</h1>
        </header>

        <main>
            <h2>Conteúdo Principal</h2>
            <p>Esta é a área principal da página.</p>
        </main>

        <footer>
            <p>Rodapé da página</p>
        </footer>
    </div>

</body>

</html>
