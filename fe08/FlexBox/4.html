<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Missão F4</title>
    <style>
        .cartao {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            background-color: lightblue;
        }

        button {
            margin-top: auto;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="cartao">
        <h3>Cartão Do negro chucro</h3>

        <p>Este é um exemplo de cartão com botão no rodapé.</p>

        <button>Saiba mais</button>
    </div>

</body>

</html>
