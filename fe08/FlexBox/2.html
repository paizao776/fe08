<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Missão F2</title>
    <style>
        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #222;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header class="topo">
        <span class="logo">samuel rustico</span>

        <nav class="links">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

</body>

</html>
