<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Missão F5</title>
    <style>
        .grupo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 24px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .confirmar {
            background-color: green;
        }

        .cancelar {
            background-color: gray;
        }

        .excluir {
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="grupo">
        <button class="confirmar">Confirmar</button>
        <button class="cancelar">Cancelar</button>
        <button class="excluir">Excluir</button>
    </div>

</body>

</html>
